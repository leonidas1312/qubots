qubots_schema_version: 3
type: optimizer
name: pulp_milp
entrypoint: qubot.py:PuLPMILPOptimizer
capabilities:
  - milp_dense
  - milp_sparse
  - integer_only
  - continuous
requirements:
  - "pulp>=3.0"
metrics:
  - objective
  - feasibility
parameters:
  time_limit_seconds:
    default: null
  log_to_console:
    default: false
