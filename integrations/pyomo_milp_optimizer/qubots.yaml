qubots_schema_version: 3
type: optimizer
name: pyomo_milp
entrypoint: qubot.py:PyomoMILPOptimizer
capabilities:
  - milp_dense
  - milp_sparse
  - integer_only
  - continuous
requirements:
  - "pyomo>=6.8"
  - "highspy>=1.7"
metrics:
  - objective
  - feasibility
parameters:
  solver:
    default: appsi_highs
  time_limit_seconds:
    default: null
  log_to_console:
    default: false
