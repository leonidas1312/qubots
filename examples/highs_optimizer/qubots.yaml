qubots_schema_version: 3
type: optimizer
name: highs
entrypoint: qubot.py:HiGHSOptimizer
capabilities:
  - milp_dense
  - milp_sparse
  - continuous
  - integer_only
requirements:
  - "highspy>=1.7"
parameters:
  time_limit_seconds:
    default: null
  mip_rel_gap:
    default: null
  threads:
    default: null
  log_to_console:
    default: false
